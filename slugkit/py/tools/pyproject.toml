[project]
name = "slugkit-tools"
version = "0.1.0"
description = "SlugKit Tools - Python utilities for building and managing SlugKit dictionaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
]

authors = [
    { name = "Sergei Fedorov" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
compile-dict = "slugkit.tools.compile_dict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slugkit"]

